function formSVG(key,overlay){
  const A=FORM_ART[key],[vx,vy,vw,vh]=A.vb,sc=Math.min(1,PAGE_W/vw,PAGE_H/vh);
  return `<section class="pp form"><svg class="paper" xml:space="preserve" viewBox="${vx} ${vy} ${vw} ${vh}" width="${(vw*sc).toFixed(1)}pt" height="${(vh*sc).toFixed(1)}pt">${A.svg.replace('{LOGO}',FORM_LOGO)}${overlay}</svg></section>`;
}
// A value written on a blank line: shrinks to fit, and squeezes as a last resort.
function onLine(fld,val,size){
  val=String(val??'').replace(/\s+/g,' ').trim();if(!val||!fld)return '';
  let s=size||10;const [x,y,w]=fld;while(s>6&&val.length*s*0.5>w)s-=0.5;
  const squeeze=val.length*s*0.5>w?` textLength="${w}" lengthAdjust="spacingAndGlyphs"`:'';
  return `<text class="fv" x="${x}" y="${y}" font-size="${s}"${squeeze}>${svgEsc(val)}</text>`;
}
const tick=c=>c?`<path d="M${c[0]-2.6} ${c[1]-2.6}L${c[0]+2.6} ${c[1]+2.6}M${c[0]+2.6} ${c[1]-2.6}L${c[0]-2.6} ${c[1]+2.6}" stroke="#000" stroke-width="1.1" fill="none"/>`:'';

const inBlank=(b,val,size)=>b&&val?`<text class="fv" x="${(b[0]+b[2]/2).toFixed(1)}" y="${(b[1]+b[3]-1.6).toFixed(1)}" font-size="${size||7.5}" text-anchor="middle">${svgEsc(val)}</text>`:'';
// Text that starts on a blank line and continues underneath it.
function flowText(text,first,below,size){
  text=String(text||'').trim();if(!text)return '';
  for(let s=size;s>=6;s-=0.5){
    const lh=s*1.2,maxLines=Math.floor(below[3]/lh);const paras=text.split(/\n+/);const lines=[];
    let firstW=first[2];
    paras.forEach(p=>{const words=p.split(/\s+/).filter(Boolean);let cur='';words.forEach(wd=>{const w=lines.length===0?firstW:below[2];const t=cur?cur+' '+wd:wd;if(cur&&t.length*s*0.5>w){lines.push(cur);cur=wd}else cur=t});if(cur)lines.push(cur)});
    if(lines.length-1<=maxLines||s<=6){
      return lines.slice(0,maxLines+1).map((l,i)=>i===0?`<text class="fv" x="${first[0]}" y="${first[1]}" font-size="${s}">${svgEsc(l)}</text>`:`<text class="fv" x="${below[0]}" y="${(below[1]+(i-1)*lh+s*0.2).toFixed(1)}" font-size="${s}">${svgEsc(l)}</text>`).join('');
    }
  }
  return '';
}

// Safari prints straight away, before it has decoded the pictures just put on the page (diagrams, logo,
// signature), so they come out blank. Lay the pages out off-screen and decode each picture first;
// give up after 3 s rather than never printing. Returns null when there is nothing to wait for.
function imagesReady(el){

  if(!srcs.length||typeof Image==='undefined'||!('decode' in Image.prototype))return null;
  el.classList.add('prep');

}

// Each printed page becomes a picture of the page (200 dpi; labels 300 dpi) in a PDF of the right paper size.

    const sv=pg.matches('.pp.form')&&pg.querySelector('svg.paper');

      pages.push(await rasterPage(612,792,200,[(612-w)/2,34,w,h],(pw,ph)=>paperSVG(sv,pw,ph,css)))}

const xmlText=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function paperSVG(sv,w,h,css){

async function rasterPage(pw,ph,dpi,[x,y,w,h],build){

  const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);

function buildPDF(pages){

  put('%PDF-1.4\n');
  obj(1,()=>put('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>put(`<< /Type /Pages /Kids [${pages.map((_,i)=>(3+i*3)+' 0 R').join(' ')}] /Count ${pages.length} >>`));
  pages.forEach((p,i)=>{const o=3+i*3,c=`q ${p.w} 0 0 ${p.h} 0 0 cm /Im Do Q`;
    obj(o,()=>put(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${p.w} ${p.h}] /Resources << /XObject << /Im ${o+2} 0 R >> >> /Contents ${o+1} 0 R >>`));
    obj(o+1,()=>put(`<< /Length ${c.length} >>\nstream\n${c}\nendstream`));
    obj(o+2,()=>{put(`<< /Type /XObject /Subtype /Image /Width ${p.pw} /Height ${p.ph} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.jpg.length} >>\nstream\n`);put(p.jpg);put('\nendstream')})});

  return new Blob(parts,{type:'application/pdf'});
}

  if(r.status===403){if(r.headers&&r.headers.get('x-ratelimit-remaining')==='0')return 'GitHub rate limit reached. Try again in a few minutes.';return `The token can’t ${doing}. Give it Contents read/write access to ${cfg.owner}/${cfg.repo}.${m}`}
  if(r.status===409)return 'The file changed on GitHub while saving. Pull, then push again.';

  return `GitHub returned ${r.status} while trying to ${doing}.${m}`;
}
async function explain404(){

  if(!repo.ok)return httpError(repo,'read the repository');
  const br=await gh('GET','/branches/'+encodeURIComponent(cfg.branch));
  if(br.status===404){const all=await gh('GET','/branches?per_page=20');const names=all.ok&&Array.isArray(all.j)?all.j.map(b=>b.name).join(', '):'';return `Branch “${cfg.branch}” doesn’t exist in ${cfg.repo}.${names?' Branches: '+names+'.':''}`}

let remoteCache=null;
async function readRemote(){
  const key=cfg.owner+'/'+cfg.repo+'/'+cfg.branch+'/'+cfg.path;
  const hit=remoteCache&&remoteCache.key===key?remoteCache:null;
  const r=await gh('GET',contentPath()+'?ref='+encodeURIComponent(cfg.branch),null,hit?{'If-None-Match':hit.etag}:null);
  if(r.status===304&&hit)return {sha:hit.sha,data:JSON.parse(hit.text)};
  const rm=await readRemoteFrom(r);
  const et=r.headers&&r.headers.get&&r.headers.get('etag');
  remoteCache=et&&!rm.missing?{key,etag:et,sha:rm.sha,text:JSON.stringify(rm.data)}:null;
  return rm;
}
async function readRemoteFrom(r){
  if(r.status===200&&!r.j.content&&r.j.sha){const d=await readBlob(r.j.sha);if(!d||d.app!==APP)throw new Error(cfg.path+' on GitHub could not be read.');return {sha:r.j.sha,data:d}}
  if(r.status===200){let d=null;try{d=JSON.parse(b64decode(r.j.content))}catch(e){throw new Error('The GitHub file is not valid JSON. Check '+cfg.path+'.')}if(!d||d.app!==APP)throw new Error(cfg.path+' on GitHub is not a Pet Dental Clinic data file.');return {sha:r.j.sha,data:d}}
  if(r.status===404){const why=await explain404();if(why)throw new Error(why);return {missing:true}}
  throw new Error(httpError(r,'read '+cfg.path));
}
function syncReady(){if(!cfg.owner||!cfg.repo){syncMsg('Enter the owner and private repo, then save.','crit');return false}if(!LS.get(TKEY)){syncMsg('Paste an access token first.','crit');return false}return true}
/* ---------- automatic sync, merged field by field ---------- */
// Each device syncs on its own a few seconds after edits, when the app opens or comes back on screen,
// when the connection returns, and every minute while open. Changes are merged three ways against the
// copy both devices last had in common (read back from GitHub's history by its blob sha), so edits to
// different fields, visits or patients on different devices are all kept.
const CKEY='pdc-conflicts-v1';
const localDirty=()=>(data.sync.rev||0)>(cfg.baseRev||0);
const syncOn=()=>cfg.backend==='github'&&!!cfg.owner&&!!cfg.repo&&!!LS.get(TKEY)&&cfg.auto!==false;
let syncing=null,syncAgain=false,syncTimer=null,syncState='',syncErr='',pendingRender=false,conflictNote=false;
function scheduleSync(ms){if(!syncOn())return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow({quiet:true}),ms??4000)}
function setSyncState(s,err){syncState=s;syncErr=err||'';updateSyncChip()}

// undefined, null and '' all mean "empty" and compare equal; key order does not matter
const blankV=x=>x===undefined||x===null||x==='';
function same(a,b){
  if(a===b||(blankV(a)&&blankV(b)))return true;
  if(!a||!b||typeof a!=='object'||typeof b!=='object'||Array.isArray(a)!==Array.isArray(b))return false;
  if(Array.isArray(a)){for(let i=0,n=Math.max(a.length,b.length);i<n;i++)if(!same(a[i],b[i]))return false;return true}
  for(const k of new Set([...Object.keys(a),...Object.keys(b)]))if(!same(a[k],b[k]))return false;return true;
}
const isObj=x=>!!x&&typeof x==='object'&&!Array.isArray(x);
const idList=a=>Array.isArray(a)&&a.length>0&&a.every(x=>isObj(x)&&typeof x.id==='string');
// b = last common copy, l = this device, r = GitHub. Where both changed the same value, `prefer` wins
// and the other value is recorded in `out`.
function merge3(b,l,r,path,out,prefer){
  if(same(l,r))return l;
  if(same(b,l))return r;
  if(same(b,r))return l;
  if(l===undefined)return r;   // deleted here but edited there: keep the edit
  if(r===undefined)return l;
  if(isObj(l)&&isObj(r)){const o={};for(const k of new Set([...Object.keys(l),...Object.keys(r)])){const v=merge3(isObj(b)?b[k]:undefined,l[k],r[k],path.concat(k),out,prefer);if(v!==undefined)o[k]=v}return o}
  if(Array.isArray(l)&&Array.isArray(r)){
    if((idList(l)||!l.length)&&(idList(r)||!r.length)){  // records with ids (patients, visits, medications): match by id
      const bm=new Map((Array.isArray(b)?b:[]).filter(isObj).map(x=>[x.id,x])),lm=new Map(l.map(x=>[x.id,x])),rm=new Map(r.map(x=>[x.id,x]));
      const o=[];[...l.map(x=>x.id),...r.map(x=>x.id).filter(id=>!lm.has(id))].forEach(id=>{const v=merge3(bm.get(id),lm.get(id),rm.get(id),path.concat(id),out,prefer);if(v!==undefined)o.push(v)});return o;
    }
    const bb=Array.isArray(b)?b:[],o=[];   // lists by position (monitoring grid cells, drug rows)
    for(let i=0,n=Math.max(l.length,r.length);i<n;i++)o[i]=merge3(bb[i],l[i],r[i],path.concat(i),out,prefer);
    while(o.length&&o[o.length-1]===undefined)o.pop();return o;
  }
  const keep=prefer==='remote'?r:l;out.push({path,kept:keep,other:prefer==='remote'?l:r,otherFrom:prefer==='remote'?'this device':'the other device'});return keep;
}
// The example patients stay on each device and are never synced.
const sharedPart=d=>({version:1,app:APP,patients:(d.patients||[]).filter(x=>!x.sample),visits:(d.visits||[]).filter(x=>!x.sample),settings:d.settings||{}});

async function readBlob(sha){
  const r=await gh('GET','/git/blobs/'+encodeURIComponent(sha));
  if(!r.ok||!r.j||!r.j.content)return null;
  try{return JSON.parse(b64decode(r.j.content))}catch(e){return null}
}
function syncNow(opts={}){
  if(syncing){syncAgain=true;return syncing}
  if(opts.manual){if(!syncReady())return Promise.resolve()}else if(!syncOn())return Promise.resolve();
  clearTimeout(syncTimer);
  syncing=(async()=>{
    setSyncState('syncing');conflictNote=false;
    try{
      for(let attempt=0;attempt<3;attempt++){
        const rm=await readRemote();
        if(!rm.missing&&rm.sha===cfg.baseSha&&!localDirty()){finishSync('Up to date.',opts);return}
        flushSave();
        const local=sharedPart(data),remote=rm.missing?null:sharedPart(rm.data);
        let base=null,prefer='local';
        if(!rm.missing){
          if(rm.sha===cfg.baseSha)base=remote;
          else if(!localDirty())base=local;
          else if(cfg.baseSha)base=await readBlob(cfg.baseSha);
          if(!base){base={};prefer='remote'}   // no common copy (new device, or a restored backup): add, never overwrite
        }
        // from here to applying the result nothing is awaited, so no typing can slip in between
        flushSave();
        const conflicts=[];
        const M=remote?merge3(sharedPart(base),sharedPart(data),remote,[],conflicts,prefer):sharedPart(data);
        const changedLocal=!same(M,sharedPart(data)),changedRemote=!remote||!same(M,remote);
        if(changedLocal){
          M.visits.forEach(ensureShape);
          data=Object.assign({},M,{patients:data.patients.filter(x=>x.sample).concat(M.patients),visits:data.visits.filter(x=>x.sample).concat(M.visits),sync:data.sync});
          lastBody=bodyOf(data);LS.set(KEY,JSON.stringify(data));refreshAfterSync();
        }
        if(conflicts.length)recordConflicts(conflicts);
        const rRev=rm.missing?0:(rm.data.sync&&rm.data.sync.rev||0);
        if(!changedRemote){
          data.sync.rev=rRev;cfg.baseRev=rRev;cfg.baseSha=rm.sha;lastBody=bodyOf(data);LS.set(KEY,JSON.stringify(data));saveCfg();
          finishSync(changedLocal?'Updated from another device.':'Up to date.',opts);return;
        }
        const appliedBody=bodyOf(data),newRev=Math.max(data.sync.rev||0,rRev)+1;
        const payload=Object.assign({},M,{sync:{rev:newRev,modified:new Date().toISOString(),device:cfg.device}});
        const body={message:`Update visits from ${cfg.device} (rev ${newRev})`,content:b64encode(JSON.stringify(payload)),branch:cfg.branch};
        if(!rm.missing)body.sha=rm.sha;
        const w=await gh('PUT',contentPath(),body);
        if(w.status===409||w.status===422)continue;   // someone saved in between: read again and merge again
        if(!w.ok)throw new Error(httpError(w,'write '+cfg.path));
        const typed=bodyOf(data)!==appliedBody;       // edits made while the upload was running stay unsynced
        cfg.baseRev=newRev;cfg.baseSha=w.j&&w.j.content&&w.j.content.sha||null;saveCfg();
        data.sync=Object.assign({},payload.sync,typed?{rev:newRev+1}:{});lastBody=typed?'':bodyOf(data);LS.set(KEY,JSON.stringify(data));
        if(typed)scheduleSync();
        finishSync(changedLocal?'Synced changes both ways.':'Sent changes to GitHub.',opts);return;
      }
      throw new Error('GitHub kept changing while saving. Will try again shortly.');
    }catch(e){
      const offline=(e&&e.name==='TypeError')||(typeof navigator!=='undefined'&&navigator.onLine===false);
      setSyncState(offline?'offline':'error',offline?'':(e.message||String(e)));
      if(opts.manual||!offline)syncMsg(offline?'Offline. Changes will sync when the connection returns.':(e.message||String(e)),'crit',!opts.manual);
    }finally{
      syncing=null;if(syncAgain){syncAgain=false;scheduleSync(300)}
    }
  })();
  return syncing;
}
function finishSync(msg,opts){cfg.lastSync=new Date().toISOString();saveCfg();setSyncState('');syncMsg(msg,'ok',!opts.manual||conflictNote)}  // keep a conflict warning on screen
// Redraw with incoming changes, but never under someone's fingers.
function busyEditing(){const a=document.activeElement;return (a&&main.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))||sigDrawing||!!$('#modalRoot').innerHTML}
function refreshAfterSync(){if(busyEditing())pendingRender=true;else render(true)}
function flushPendingRender(){if(pendingRender&&!busyEditing()){pendingRender=false;render(true)}}

function loadConflicts(){return parseJSON(LS.get(CKEY))||[]}
function describePath(path){
  const [kind,id,...rest]=path;let who='';
  if(kind==='visits'){const v=visit(id);const p=v&&patient(v.patientId);who=`${p&&p.name||'A visit'}${v?' · '+prettyDate(v.date):''}`}
  else if(kind==='patients'){const p=patient(id);who=p&&p.name||'A patient'}
  else{who='Settings';rest.unshift(id)}
  return `${who}: ${rest.join(' › ')}`;
}
function recordConflicts(list){
  const all=loadConflicts().concat(list.map(c=>({path:c.path,label:describePath(c.path),kept:c.kept,other:c.other,otherFrom:c.otherFrom,at:new Date().toISOString()}))).slice(-50);
  LS.set(CKEY,JSON.stringify(all));
  conflictNote=true;toast(`${list.length} ${list.length===1?'field was':'fields were'} changed on two devices at once. Review in Settings.`);
  if(ui.view==='settings'&&!busyEditing())render(true);
}
function setPath(path,val){
  let o=data[path[0]];
  for(let i=1;i<path.length-1;i++){const k=path[i];o=Array.isArray(o)&&typeof k==='string'?o.find(x=>x&&x.id===k):o&&o[k];if(!o)return false}
  const last=path[path.length-1];
  if(Array.isArray(o)&&typeof last==='string'){const i=o.findIndex(x=>x&&x.id===last);if(i<0){if(val)o.push(val)}else if(val===undefined)o.splice(i,1);else o[i]=val}
  else if(o){if(val===undefined)delete o[last];else o[last]=val}
  return true;
}
const showVal=x=>blankV(x)?'(empty)':typeof x==='object'?JSON.stringify(x).slice(0,80):String(x).slice(0,80);
function updateSyncChip(){
  const c=$('#syncChip');if(!c)return;const dot=c.querySelector('.dot'),tx=c.querySelector('span:last-child');
  let t='Saved on this device',k='ok';
  if(!storageOK){t='Not saving: storage blocked';k='crit'}
  else if(cfg.backend==='github'){if(syncState==='syncing'){t='Syncing…';k='ok'}else if(syncState==='error'){t='Sync problem';k='crit'}else if(syncState==='offline'){t=localDirty()?'Offline · will sync':'Offline';k='warn'}else if(localDirty()){t=cfg.auto===false?'Changes not synced':'Syncing soon';k='warn'}else if(cfg.lastSync){t='Synced '+new Date(cfg.lastSync).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}}
  dot.className='dot '+k;tx.textContent=t;
}

window.__pdc={set printViaShare(x){PRINT_VIA_SHARE=x},get pdfOut(){return pdfOut},buildPDF,get data(){return data},get ui(){return ui},cfg,saveNow,render,go,setK,getK,flag,mapOf,calcHTML,weightKg,missing,extractions,dischargeType,syncNow,merge3,same,loadConflicts,toothName,ensureShape,CHARTS,buildSig,labelHTML,formulary,lblSet,rxList,importFormularyCSV,addMonthsISO};
if(firstRun){seed(data);lastBody=bodyOf(data);LS.set(KEY,JSON.stringify(data))}
render();
setTimeout(()=>syncNow({quiet:true}),800);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncNow({quiet:true});else if(localDirty())syncNow({quiet:true})});
window.addEventListener('online',()=>syncNow({quiet:true}));
setInterval(()=>{if(document.visibilityState==='visible')syncNow({quiet:true})},60000);
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}
})();
